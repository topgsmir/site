name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topgsm_test
          POSTGRES_PASSWORD: topgsm_test
          POSTGRES_DB: topgsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topgsm_test -d topgsm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://topgsm_test:topgsm_test@localhost:5432/topgsm_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.3.4

      - name: Bootstrap worktree
        run: pnpm run bootstrap

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test

      - name: Apply test database migrations
        run: pnpm --filter topgsm-api prisma:migrate

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build
