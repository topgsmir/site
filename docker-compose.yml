services:
  postgres:
    image: postgres:16-alpine
    container_name: topgsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topgsm
      POSTGRES_PASSWORD: topgsm
      POSTGRES_DB: topgsm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - topgsm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topgsm -d topgsm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    container_name: topgsm-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://topgsm:topgsm@postgres:5432/topgsm
      MEDIA_ROOT: /var/lib/topgsm/media
    volumes:
      - topgsm-media-data:/var/lib/topgsm/media
    ports:
      - "127.0.0.1:4000:4000"
    command: ["pnpm", "-C", "apps/api", "dev"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
    container_name: topgsm-web
    depends_on:
      - api
    environment:
      API_URL: http://api:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TopGSM}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BRIDGE_FEATURE_ENABLED: ${NEXT_PUBLIC_BRIDGE_FEATURE_ENABLED:-true}
      NEXT_PUBLIC_GOGHDI_SDK_URL: ${NEXT_PUBLIC_GOGHDI_SDK_URL:-}
      NEXT_PUBLIC_GOGHDI_TENANT_ID: ${NEXT_PUBLIC_GOGHDI_TENANT_ID:-}
      NEXT_PUBLIC_GOGHDI_API_URL: ${NEXT_PUBLIC_GOGHDI_API_URL:-}
      NEXT_PUBLIC_GOGHDI_SOCKET_URL: ${NEXT_PUBLIC_GOGHDI_SOCKET_URL:-}
      NEXT_PUBLIC_GOGHDI_WIDGET_URL: ${NEXT_PUBLIC_GOGHDI_WIDGET_URL:-}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    command: ["pnpm", "-C", "apps/web", "dev", "--hostname", "0.0.0.0"]

volumes:
  topgsm-postgres-data:
  topgsm-media-data:
