  <title>TopGSM comment avatar options (detailed 1–10)</title>
  <style>
    :root { --navy:#011627; --blue:#20a4f3; }
    * { box-sizing: border-box; }
    body { margin:0; padding:32px 24px 48px; font-family:Segoe UI,system-ui,sans-serif; color:var(--navy); background:#fff; }
    h1 { margin:0 0 8px; font-size:1.35rem; font-weight:700; }
    .intro { margin:0 0 28px; max-width:56ch; color:#4a5a66; line-height:1.5; font-size:.95rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:32px 24px; max-width:1040px; }
    .card { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; margin:0; }
    .frame { width:128px; height:128px; border-radius:50%; overflow:hidden; box-shadow:0 4px 18px rgb(1 22 39 / 12%); }
    .frame svg { display:block; width:100%; height:100%; }
    .num { font-size:.75rem; font-weight:700; letter-spacing:.04em; color:var(--blue); text-transform:uppercase; }
    .label { margin:0; font-size:.92rem; font-weight:600; line-height:1.3; }
    .desc { margin:0; font-size:.74rem; line-height:1.45; color:#5a6a76; max-width:22ch; }
  </style>
</head>
